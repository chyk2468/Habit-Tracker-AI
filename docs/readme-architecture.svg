<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">NeuroTrack Habit Tracker workflow</title><desc id="desc">A React application organises daily data and routes the user between dashboard, tracker, analytics, and settings views.</desc><rect width="1200" height="400" rx="18" fill="#101A2A"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#00B8A9">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#F0F4FA">NeuroTrack Habit Tracker</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#A1B0C6">Daily logging to progress and analytics</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#2D3B52"/><path d="M 300 237 L 330 237" stroke="#A1B0C6" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#A1B0C6" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#A1B0C6" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#A1B0C6" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#A1B0C6" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#A1B0C6" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#1A2940" stroke="#2D3B52" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#00B8A9"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#00B8A9">01 / TODAY</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F0F4FA">Daily habit data</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A1B0C6">Initialise the current day's record.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#1A2940" stroke="#2D3B52" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#7C8CF8"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#7C8CF8">02 / TRACKER</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F0F4FA">Record habits</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A1B0C6">Update day-to-day entries.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#1A2940" stroke="#2D3B52" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#D1A768"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#D1A768">03 / ANALYTICS</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F0F4FA">View progress</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A1B0C6">Review history and patterns.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#1A2940" stroke="#2D3B52" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#00B8A9"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#00B8A9">04 / DASHBOARD</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F0F4FA">Daily overview</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A1B0C6">Move between views and settings.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#00B8A9">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A1B0C6">Based on the current React app structure; data persistence follows the useNeuroData hook.</text></svg>